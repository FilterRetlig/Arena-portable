[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-voice"
version = "0.1.0"
description = "Russian voice messaging module and web chat studio for Arena-portable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
local-stt = ["faster-whisper>=1.0.0"]

[tool.setuptools.packages.find]
include = ["arena_voice*"]

[tool.setuptools.package-data]
arena_voice = ["static/*", "static/clips/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
